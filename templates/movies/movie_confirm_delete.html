{% extends "base.html" %}

{% block title %}Delete {{ movie.title }} · Movie Watchlist{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body">
                <h1 class="h4 text-danger mb-3">Delete Movie</h1>
                <p>Are you sure you want to delete
                   <strong>“{{ movie.title }}”</strong> from your watchlist?
                   This action cannot be undone.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Yes, delete</button>
                        <a href="{% url 'movies:movie_list' %}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
